appId: ir.saman.app
productName: Ravaal
copyright: Ravaal Life OS
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
directories:
  app: build-resources/desktop-app
  output: dist-desktop
  buildResources: build-resources
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .next/standalone
    to: server
    filter:
      - "**/*"
      - "!dist-desktop{,/**/*}"
      - "!**/dist-desktop{,/**/*}"
      - "!.git{,/**/*}"
      - "!**/.git{,/**/*}"
      - "!data{,/**/*}"
      - "!**/*.db*"
      - "!**/.env*"
      - "!**/.session-secret"
  - from: build-resources/node
    to: node
    filter:
      - "**/*"
win:
  icon: build-resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Ravaal-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # ASCII only — Persian breaks NSIS shortcut encoding on some Windows locales
  shortcutName: Ravaal
  runAfterFinish: true
  # Never wipe %APPDATA%\Saman or %APPDATA%\Hesabdari
  deleteAppDataOnUninstall: false
portable:
  artifactName: Ravaal-Portable.exe
  requestExecutionLevel: user
