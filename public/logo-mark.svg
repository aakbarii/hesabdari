<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="hesabdari-title">
  <title id="hesabdari-title">حسابداری</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17263b"/>
      <stop offset="1" stop-color="#334a67"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <!-- Routine cycle: an open ring whose gap marks the start of the day -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="#edf2f8" stroke-width="44" stroke-linecap="round" stroke-dasharray="690 89" transform="rotate(-70 256 256)"/>
  <!-- Start node sitting on the ring -->
  <circle cx="298.4" cy="139.4" r="30" fill="#9db9d5" stroke="#17263b" stroke-width="12"/>
  <!-- Core -->
  <circle cx="256" cy="256" r="34" fill="#9db9d5"/>
</svg>
