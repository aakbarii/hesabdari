<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="40%" stop-color="#064e3b" />
      <stop offset="85%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011b15" />
    </linearGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Emerald Gem / Shield Primary Gradient -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Radiant Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glassGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Subtle Rim -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#rimGrad)" stroke-width="4" opacity="0.75" />

  <!-- Diagonal Glass Specular Flare -->
  <path d="M 12 128 C 12 64, 64 12, 128 12 L 400 12 C 240 180, 100 320, 12 400 Z" fill="url(#glassGrad)" />

  <!-- Central Emblem Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Behind-Glow Circle -->
    <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" />

    <!-- Outer Golden Life Ring (Dynamic Balance Arc) -->
    <path d="M 170 190 C 200 130, 312 130, 342 190 C 370 245, 310 320, 256 365 C 202 320, 142 245, 170 190 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Inner Emerald Diamond / Shield Core (Wealth & Security) -->
    <path d="M 256 120 L 370 205 L 340 330 L 256 388 L 172 330 L 142 205 Z"
          fill="url(#gemGrad)" />

    <!-- Gem Facet Shading (Geometric Modern Cut) -->
    <!-- Top-Right Facet (Light) -->
    <polygon points="256,120 370,205 256,256" fill="#ffffff" opacity="0.22" />
    <!-- Bottom-Right Facet (Mid-Tone) -->
    <polygon points="370,205 340,330 256,256" fill="#047857" opacity="0.35" />
    <!-- Bottom-Left Facet (Deep Shade) -->
    <polygon points="340,330 256,388 256,256" fill="#022c22" opacity="0.45" />
    <!-- Left-Bottom Facet -->
    <polygon points="256,388 172,330 256,256" fill="#034e3f" opacity="0.3" />
    <!-- Top-Left Facet (Soft Glow) -->
    <polygon points="172,330 142,205 256,256" fill="#10b981" opacity="0.15" />
    <polygon points="142,205 256,120 256,256" fill="#a7f3d0" opacity="0.28" />

    <!-- Core Vitality / Life Pulse Symbol (Golden Spark / Growth Crest) -->
    <g transform="translate(256, 254) scale(0.92)">
      <!-- Golden Horizon / Pulse Wave -->
      <path d="M -60 10 L -25 10 L -8 -30 L 12 36 L 28 -10 L 60 -10"
            fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -60 10 L -25 10 L -8 -30 L 12 36 L 28 -10 L 60 -10"
            fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Top Star / Diamond Shimmer -->
    <circle cx="256" cy="120" r="10" fill="#ffffff" />
    <circle cx="256" cy="120" r="18" fill="#fef08a" opacity="0.4" filter="url(#glow)" />
  </g>
</svg>
