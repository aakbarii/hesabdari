<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="ravaal-title ravaal-desc">
  <title id="ravaal-title">روال — Ravaal</title>
  <desc id="ravaal-desc">A continuous emerald loop with a golden growth node — routine, life, and balance</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="55%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011a14"/>
    </linearGradient>
    <linearGradient id="loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#34d399" stroke-opacity="0.28" stroke-width="3"/>

  <!-- Soft highlight -->
  <path d="M16 140C16 70 70 16 140 16H380C240 140 120 280 16 360Z" fill="#fff" opacity="0.06"/>

  <g filter="url(#soft)" transform="translate(256 256)">
    <!-- Continuous routine loop (∞-inspired closed path) -->
    <path
      d="M-118 0
         C-118 -72 -58 -118 0 -72
         C58 -118 118 -72 118 0
         C118 72 58 118 0 72
         C-58 118 -118 72 -118 0Z"
      fill="none"
      stroke="url(#loop)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Inner track for depth -->
    <path
      d="M-78 0
         C-78 -46 -38 -76 0 -46
         C38 -76 78 -46 78 0
         C78 46 38 76 0 46
         C-38 76 -78 46 -78 0Z"
      fill="none"
      stroke="#a7f3d0"
      stroke-opacity="0.35"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Growth / vitality node -->
    <circle cx="0" cy="0" r="42" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>

    <!-- Minimal ascending bars (life + finance pulse) -->
    <g fill="#064e3b">
      <rect x="-18" y="2" width="10" height="18" rx="3"/>
      <rect x="-5" y="-8" width="10" height="28" rx="3"/>
      <rect x="8" y="-16" width="10" height="36" rx="3"/>
    </g>
  </g>
</svg>
